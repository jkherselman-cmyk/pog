<body>
<div id="site-header"></div>
<main>

<section class="page-hero"><img class="bg" src="https://picsum.photos/id/1057/1920/600" alt=""><div class="hero-overlay"></div><div class="content"><h1>Contact Us</h1><p>Start planning your safari today.</p></div></section>
<section class="pad reveal"><div class="container"><div class="grid grid-2">
<div>
<p class="eyebrow">Get in Touch</p><h2 style="font-size:1.75rem;margin-top:.5rem">Send an Enquiry</h2>
<form onsubmit="event.preventDefault();this.reset();alert('Thanks — we\'ll be in touch soon!')" style="margin-top:1.5rem">
  <div class="form-group"><label>Name</label><input required></div>
  <div class="form-group"><label>Email</label><input type="email" required></div>
  <div class="form-group"><label>Phone</label><input type="tel"></div>
  <div class="form-group"><label>Interested Package</label><select><option>Plains Game — 5 Day</option><option>Big Game — 7 Day</option><option>Family & Observer — 10 Day</option><option>Custom</option></select></div>
  <div class="form-group"><label>Message</label><textarea></textarea></div>
  <button class="btn btn-gold btn-lg" type="submit">Send Enquiry</button>
</form>
</div>
<div>
<p class="eyebrow">Reach Us Directly</p><h2 style="font-size:1.75rem;margin-top:.5rem">Contact Details</h2>
<ul class="contact-list" style="margin-top:1.5rem;list-style:none;color:var(--muted)">
  <li style="display:flex;gap:.75rem;margin-bottom:1rem"><strong style="color:var(--earth-dark)">Email:</strong> info@pogafricansafaris.com</li>
  <li style="display:flex;gap:.75rem;margin-bottom:1rem"><strong style="color:var(--earth-dark)">Phone:</strong> +27 12 345 6789</li>
  <li style="display:flex;gap:.75rem;margin-bottom:1rem"><strong style="color:var(--earth-dark)">Location:</strong> Eastern Cape, South Africa</li>
</ul>
<div style="margin-top:2rem"><img src="https://picsum.photos/id/1036/800/500" alt="Lodge" style="border-radius:.6rem"></div>
</div>
</div></div></section>
